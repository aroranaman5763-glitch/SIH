<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Hunt · Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wide">
  <p class="links"><a href="/">Senior app</a><a href="/device.html">Café device</a></p>
  <h1>Story Hunt dashboard</h1>
  <p class="muted">One view for the three partners: the coordinator (circles), the café (verified visits) and the NGO (community events).</p>
  <div class="kpis" id="kpis"></div>
  <div class="cols">
    <div class="card"><h2>☕ Café partner: verified visits</h2><div id="cafe"></div></div>
    <div class="card"><h2>🧒 NGO partner: final-chapter events</h2><div id="ngo"></div></div>
  </div>
  <h2 style="margin-top:8px">Circles</h2>
  <div id="circles"></div>
  <button class="btn mini quiet" id="reset">Reset all demo data</button>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const post = (p, body) => fetch('/api' + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => r.json());
const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
let last = '';
async function load() {
  const d = await (await fetch('/api/dashboard')).json();
  const key = JSON.stringify(d);
  if (key === last) return;
  last = key;
  const k = d.totals, fb = d.feedback;
  document.getElementById('kpis').innerHTML = [
    [k.seniors, 'Seniors signed up'], [k.circles, 'Circles'], [d.cafe.visits, 'Verified café visits'],
    [k.solved, 'Stories solved together'], [k.events, 'Community events done'], [k.points, 'Points earned'],
    [`${fb.good} / ${fb.okay} / ${fb.bad}`, 'Feedback: good / okay / not good'],
  ].map(([v, l]) => `<div class="kpi"><b>${v}</b>${l}</div>`).join('');

  document.getElementById('cafe').innerHTML = `<p><b>${esc(d.cafe.name)}</b> · quiet hours 2 to 5 pm</p>` +
    (d.cafe.recent.length ? `<table><tr><th>Card tapped by</th><th>Time</th></tr>${d.cafe.recent.map((v) =>
      `<tr><td>${esc(v.name)}</td><td>${time(v.at)}</td></tr>`).join('')}</table>` : '<p class="muted">No visits yet. Each card tap at the device is one verified visit.</p>');

  const evs = d.circles.filter((c) => c.eventStatus !== 'locked');
  document.getElementById('ngo').innerHTML = evs.length ? evs.map((c) => `<p><b>${esc(c.eventTitle)}</b><br>${esc(c.eventPartner)} · ${esc(c.name)}<br>
    ${c.eventStatus === 'confirmed' ? '<span class="status ok">Confirmed · +200 points each</span>'
      : `<button class="btn mini" data-confirm="${c.id}">Confirm the circle came</button>`}</p>`).join('')
    : '<p class="muted">An event opens when a circle solves its story at the café.</p>';

  document.getElementById('circles').innerHTML = d.circles.length ? d.circles.map((c) => `<div class="card">
    <h2>${esc(c.name)} · ${esc(c.story)}
      <span class="status ${c.status === 'solved' ? 'ok' : c.members.length === 4 ? 'wait' : ''}">${c.status === 'solved' ? 'Solved' : c.members.length === 4 ? 'Ready to meet' : `Forming ${c.members.length}/4`}</span></h2>
    <p class="muted">Why matched: ${esc(c.reason)}</p>
    <table><tr><th>Member</th><th>Skills</th><th>Story</th><th>At café</th><th>Points</th><th>Feedback</th></tr>
    ${c.members.map((m) => `<tr><td>${esc(m.name)}${m.bot ? ' <span class="muted">(demo)</span>' : ''}</td><td>${esc(m.skills.join(', '))}</td>
      <td>Day ${m.day}/3</td><td>${m.present ? '✅' : '—'}</td><td>${m.points}</td><td>${esc(c.feedback[m.id] || '—')}</td></tr>`).join('')}</table>
    ${c.members.length < 4 ? `<button class="btn mini quiet" data-fill="${c.id}">Demo: fill with sample seniors</button>` : ''}</div>`).join('')
    : '<div class="card"><p class="muted">No circles yet. Sign up a senior in the app to start.</p></div>';
}
document.addEventListener('click', async (e) => {
  const f = e.target.dataset.fill, c = e.target.dataset.confirm;
  if (f) await post('/demo/fill', { circleId: f });
  if (c) await post(`/circles/${c}/confirm-event`);
  if (f || c) load();
});
document.getElementById('reset').onclick = async () => { if (confirm('Delete all demo data?')) { await post('/demo/reset'); load(); } };
load(); setInterval(load, 2000);
</script>
</body>
</html>
